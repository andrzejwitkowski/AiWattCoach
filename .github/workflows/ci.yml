name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  rust-architecture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: nightly-2026-01-22
          components: rust-src, rustc-dev, llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Install cargo_pup
        run: cargo +nightly-2026-01-22 install cargo_pup --version 0.1.7 --locked

      - name: Run architecture guard
        run: ./scripts/verify_arch.sh

  frontend-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install frontend dependencies
        run: bun install --cwd frontend --frozen-lockfile

      - name: Run frontend tests
        run: bun run --cwd frontend test

      - name: Build frontend
        run: bun run --cwd frontend build

  rust-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build Docker image
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: docker build -t aiwattcoach:ci .

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - rust-architecture
      - frontend-test-and-build
      - rust-test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Fetch release tags
        run: git fetch --tags --force

      - name: Resolve release version
        id: version
        run: |
          mapfile -t head_tags < <(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)

          if [ "${#head_tags[@]}" -gt 1 ]; then
            echo "HEAD has multiple release tags: ${head_tags[*]}"
            exit 1
          fi

          if [ "${#head_tags[@]}" -eq 1 ]; then
            version="${head_tags[0]}"
            created=false
          else
            latest_tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '1p')"

            if [ -z "$latest_tag" ]; then
              version="v0.1.0"
            else
              IFS='.' read -r major minor patch <<< "${latest_tag#v}"
              version="v${major}.${minor}.$((patch + 1))"
            fi

            git config user.name github-actions
            git config user.email github-actions@github.com
            git tag "$version"
            created=true
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        if: steps.version.outputs.created == 'true'
        run: git push origin "${{ steps.version.outputs.value }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to Docker registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: registry.wattly.pl
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push release image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            registry.wattly.pl/aiwattcoach:${{ steps.version.outputs.value }}
            registry.wattly.pl/aiwattcoach:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
