name: Release

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch release tags
        run: git fetch --tags --force

      - name: Resolve release version
        id: version
        run: node ./scripts/resolve-release-version.mjs "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5ddec9925e35a0a9e82d7399ccc52663121

      - name: Log in to Docker registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: registry.wattly.pl
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push release image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            registry.wattly.pl/aiwattcoach:${{ steps.version.outputs.value }}
            registry.wattly.pl/aiwattcoach:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push release tag
        if: steps.version.outputs.created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag "$VERSION"
          git push origin "$VERSION"
